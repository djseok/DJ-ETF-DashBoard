<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>동진 투자 공부실</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; background-color: #fcf8f2; }
        .signal-buy-strong { background-color: #fef2f2; border-left: 8px solid #dc2626; color: #7f1d1d; }
        .signal-buy-weak { background-color: #fff7ed; border-left: 8px solid #f97316; color: #9a3412; }
        .signal-sell { background-color: #f0fdf4; border-left: 8px solid #16a34a; color: #14532d; }
        .signal-hold { background-color: #f8fafc; border-left: 8px solid #64748b; color: #334155; }
        .corgi-bg { background-image: url('https://img.icons8.com/color/96/corgi.png'); background-repeat: no-repeat; background-position: right -10px bottom -10px; background-size: 120px; opacity: 0.1; position: absolute; top: 0; left: 0; right: 0; bottom: 0; pointer-events: none; }
    </style>
</head>
<body class="text-slate-800 antialiased p-4 md:p-8">

    <div class="max-w-5xl mx-auto relative">
        <h1 class="text-3xl font-extrabold mb-6 flex items-center text-slate-800">
            <img src="https://img.icons8.com/color/96/corgi.png" alt="웰시코기" class="w-14 h-14 mr-3 drop-shadow-md hover:rotate-12 transition-transform cursor-pointer">
            동진 투자 공부실
            <span class="ml-3 text-sm bg-orange-100 text-orange-800 px-3 py-1 rounded-full border border-orange-200 shadow-sm font-bold flex items-center">
                <i class="fas fa-paw mr-1"></i> ETF 대시보드
            </span>
        </h1>

        <div id="macroPanel" class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6 hidden">
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 flex items-center justify-between">
                <span class="text-slate-500 font-bold text-sm"><i class="fas fa-chart-line text-blue-500 mr-1"></i> 나스닥</span>
                <div class="text-right"><span id="ndxPrice" class="text-xl font-extrabold">0</span></div>
            </div>
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 flex items-center justify-between">
                <span class="text-slate-500 font-bold text-sm"><i class="fas fa-exchange-alt text-green-500 mr-1"></i> 환율</span>
                <div class="text-right"><span id="fxPrice" class="text-xl font-extrabold">0</span></div>
            </div>
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 flex items-center justify-between relative overflow-hidden">
                <span class="text-slate-500 font-bold text-sm"><i class="fas fa-fire text-red-500 mr-1"></i> VIX (공포지수)</span>
                <div class="text-right"><span id="vixPrice" class="text-xl font-extrabold">0</span></div>
            </div>
        </div>

        <div id="mainDashboard" class="hidden space-y-6">
            
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex flex-col md:flex-row items-start md:items-center justify-between gap-4">
                <div class="flex items-center">
                    <span class="font-bold text-slate-700 mr-3"><i class="fas fa-search text-orange-400 mr-2"></i> 분석 ETF:</span>
                    <select id="etfSelector" onchange="renderTable()" class="bg-slate-50 border border-slate-300 text-slate-900 text-sm font-bold rounded-lg focus:ring-orange-500 focus:border-orange-500 block p-2 min-w-[200px]"></select>
                </div>
                <div class="text-xs font-bold text-slate-500 bg-slate-100 px-3 py-1.5 rounded-lg border border-slate-200 shadow-inner">
                    <i class="fas fa-sliders-h mr-1"></i> 적용 기준: BUY <span id="uiBuyLimit" class="text-red-500">-0%</span> / SELL <span id="uiSellLimit" class="text-blue-500">+0%</span>
                </div>
            </div>

            <div id="signalCard" class="p-6 rounded-2xl shadow-md transition-all duration-300 signal-hold relative overflow-hidden">
                <div class="corgi-bg"></div>
                <div class="text-sm font-bold mb-1 opacity-80 z-10 relative">알고리즘 매매 의견 (VIX 교집합 적용)</div>
                <div class="flex flex-col md:flex-row items-start md:items-end justify-between gap-4 z-10 relative">
                    <div class="flex-1">
                        <h2 id="signalText" class="text-3xl md:text-4xl font-black tracking-tight">HOLD (관망) 💤🐕</h2>
                        <p id="signalDesc" class="mt-2 text-sm font-medium pr-4 text-slate-600">데이터를 불러오는 중입니다.</p>
                    </div>
                    <div class="text-right bg-white/60 backdrop-blur-sm p-4 rounded-xl border border-white/50 w-full md:w-auto shadow-sm">
                        <div class="text-xs font-bold text-slate-600 mb-1 flex items-center justify-end">
                            순수 체력 <span id="pureChange" class="text-blue-600 ml-1">0.00%</span> 
                            <i class="fas fa-times mx-2 text-slate-400 text-[10px]"></i> 
                            환율 변동 <span id="fxChangeText" class="text-green-600 ml-1">0.00%</span>
                        </div>
                        <div class="text-xs opacity-80 mb-1 font-bold text-slate-500">▼ 환율 반영 최종 예상 변동률</div>
                        <div id="totalChange" class="text-4xl font-black">0.00%</div>
                    </div>
                </div>
                
                <div class="mt-5 pt-4 border-t border-slate-200/50 flex flex-col md:flex-row justify-between items-start md:items-center gap-2 z-10 relative">
                    <div>
                        <div class="text-xs text-slate-500 font-bold mb-1"><i class="fas fa-bullseye text-orange-400 mr-1"></i> 보수적 예상 체결가 (오차범위 ±0.3%)</div>
                        <div class="text-xl font-black text-slate-800" id="expectedPriceRange">데이터 대기중...</div>
                    </div>
                    <div class="text-xs font-bold text-slate-500 bg-white/60 px-3 py-1.5 rounded shadow-sm border border-slate-100">
                        ETF 기준가(전일종가): ₩<span id="basePriceText">0</span>
                    </div>
                </div>
            </div>

            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="w-full text-sm text-left whitespace-nowrap">
                        <thead class="text-xs text-slate-600 uppercase bg-slate-100 border-b border-slate-200">
                            <tr>
                                <th class="px-6 py-4 font-bold">종목명</th>
                                <th class="px-6 py-4 font-bold">티커</th>
                                <th class="px-6 py-4 text-right font-bold">전일가</th>
                                <th class="px-6 py-4 text-right font-bold">현재가</th>
                                <th class="px-6 py-4 text-right font-bold">변동률</th>
                                <th class="px-6 py-4 text-right font-bold">비중</th>
                                <th class="px-6 py-4 text-right font-bold text-slate-900 bg-orange-50">변동 x 비중</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody" class="divide-y divide-slate-100"></tbody>
                        <tfoot class="bg-slate-800 text-white font-bold">
                            <tr>
                                <td colspan="6" class="px-6 py-4 text-right"><i class="fas fa-bone text-orange-300 mr-2"></i>미국 주식 순수 변동 총합 (체력)</td>
                                <td id="sumContributionFoot" class="px-6 py-4 text-right text-xl text-orange-300">0.00%</td>
                            </tr>
                        </tfoot>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 질문자님의 정상적인 구글 시트 링크가 올바르게 적용되었습니다.
        const MY_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRyotJ2TeefWbfE61uwtnUh68sk-QE4H9HULDkIaKFXbihMYFqNGXL9N2gqSBgxONQze_sTwuo4QgBN/pub?output=csv"; 
        
        let globalData = {};
        let thresholds = {}; // 매매 기준치 저장소
        let etfBasePrice = {}; // ETF 본체 기준가 저장소
        
        let macroData = { usdKrw: { change: 0 }, nasdaq: { change: 0 }, vix: { curr: 0 } };

        window.onload = function() {
            // 이 안전장치 코드를 원래 상태로 복구했습니다.
            if (MY_CSV_URL === "https://docs.google.com/spreadsheets/d/e/2PACX-1vRyotJ2TeefWbfE61uwtnUh68sk-QE4H9HULDkIaKFXbihMYFqNGXL9N2gqSBgxONQze_sTwuo4QgBN/pub?output=csv") { 
                alert("코드 안에 구글 시트 CSV 링크를 아직 넣지 않으셨습니다!"); return; 
            }
            loadData(MY_CSV_URL);
        };

        function loadData(url) {
            Papa.parse(url, { download: true, header: true, skipEmptyLines: true, complete: function(results) { processData(results.data); } });
        }

        function formatChange(val) { return `${val > 0 ? '+' : ''}${val.toFixed(2)}%`; }
        function getColorClass(val) { return val > 0 ? 'text-red-500' : (val < 0 ? 'text-blue-500' : 'text-slate-500'); }

        function processData(rows) {
            globalData = {}; thresholds = {}; etfBasePrice = {};
            const selector = document.getElementById('etfSelector');
            selector.innerHTML = '';

            rows.forEach(row => {
                const etfName = row['ETF이름'];
                if(!etfName) return;

                const prev = parseFloat(row['전일종가']) || 0;
                const curr = parseFloat(row['현재가']) || 0;
                let changeRate = prev > 0 ? ((curr - prev) / prev) * 100 : 0;

                // 1. 기준(Threshold) 데이터 파싱
                if (etfName === '기준') { thresholds[row['종목명']] = { buy: prev, sell: curr }; return; }
                
                // 2. 본체(Base Price) 데이터 파싱
                if (etfName === '본체') { etfBasePrice[row['종목명']] = prev; return; }

                // 3. 지표(Macro) 데이터 파싱
                if (etfName === '지표') {
                    if (row['종목명'] === '환율') {
                        macroData.usdKrw = { curr, change: changeRate };
                        document.getElementById('fxPrice').innerHTML = `₩${curr.toLocaleString()} <span class="text-sm ${getColorClass(changeRate)} ml-1">${formatChange(changeRate)}</span>`;
                    } else if (row['종목명'] === '나스닥') {
                        macroData.nasdaq = { curr, change: changeRate };
                        document.getElementById('ndxPrice').innerHTML = `${curr.toLocaleString()} <span class="text-sm ${getColorClass(changeRate)} ml-1">${formatChange(changeRate)}</span>`;
                    } else if (row['종목명'].includes('VIX') || row['종목명'] === '공포지수') {
                        macroData.vix = { curr };
                        let vixColor = curr >= 25 ? 'text-red-600' : 'text-slate-500';
                        document.getElementById('vixPrice').innerHTML = `<span class="${vixColor}">${curr.toFixed(2)}</span>`;
                    }
                    return; 
                }

                // 4. 일반 ETF 구성종목 데이터 파싱
                if(!globalData[etfName]) {
                    globalData[etfName] = [];
                    const option = document.createElement('option');
                    option.value = etfName; option.textContent = etfName;
                    selector.appendChild(option);
                }

                const weight = parseFloat(row['비중(%)']) || 0;
                const contribution = changeRate * (weight / 100);

                globalData[etfName].push({ name: row['종목명'], ticker: row['티커'], prev, curr, weight, changeRate, contribution });
            });

            document.getElementById('macroPanel').classList.remove('hidden');
            document.getElementById('mainDashboard').classList.remove('hidden');
            renderTable();
        }

        function renderTable() {
            const selectedEtf = document.getElementById('etfSelector').value;
            const data = globalData[selectedEtf] || [];
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            let sumContribution = 0;
            data.forEach(item => {
                sumContribution += item.contribution;
                const tr = document.createElement('tr');
                tr.className = "hover:bg-orange-50 transition-colors";
                const cColor = item.contribution > 0 ? 'text-red-600' : (item.contribution < 0 ? 'text-blue-600' : 'text-slate-600');

                tr.innerHTML = `
                    <td class="px-6 py-4 font-bold text-slate-800">${item.name}</td>
                    <td class="px-6 py-4 text-xs text-slate-500 font-mono"><span class="bg-slate-100 px-2 py-1 rounded border border-slate-200">${item.ticker}</span></td>
                    <td class="px-6 py-4 text-right text-slate-600">${item.prev.toFixed(2)}</td>
                    <td class="px-6 py-4 text-right font-black text-slate-800">${item.curr.toFixed(2)}</td>
                    <td class="px-6 py-4 text-right font-bold ${getColorClass(item.changeRate)}">${formatChange(item.changeRate)}</td>
                    <td class="px-6 py-4 text-right text-slate-600">${item.weight.toFixed(2)}%</td>
                    <td class="px-6 py-4 text-right font-black bg-orange-50/50 ${cColor}">${formatChange(item.contribution)}</td>
                `;
                tbody.appendChild(tr);
            });
            document.getElementById('sumContributionFoot').textContent = formatChange(sumContribution);
            updateSignal(sumContribution, selectedEtf);
        }

        function updateSignal(pureChange, etfName) {
            const fxChange = macroData.usdKrw.change;
            const finalCalculatedChange = (((1 + pureChange/100) * (1 + fxChange/100)) - 1) * 100;
            const currentVix = macroData.vix.curr;

            // 엑셀에서 설정한 매매 기준 가져오기
            const limit = thresholds[etfName] || { buy: -2.0, sell: 3.0 };
            document.getElementById('uiBuyLimit').textContent = limit.buy.toFixed(1) + '%';
            document.getElementById('uiSellLimit').textContent = '+' + limit.sell.toFixed(1) + '%';

            const card = document.getElementById('signalCard');
            const signalText = document.getElementById('signalText');
            const signalDesc = document.getElementById('signalDesc');
            const totalChangeEl = document.getElementById('totalChange');
            
            document.getElementById('pureChange').textContent = formatChange(pureChange);
            document.getElementById('fxChangeText').textContent = formatChange(fxChange);
            totalChangeEl.textContent = formatChange(finalCalculatedChange);

            // 매매 의견 로직 산출 (VIX 연동)
            if (finalCalculatedChange <= limit.buy) {
                if (currentVix >= 25) {
                    card.className = "p-6 rounded-2xl shadow-md transition-all duration-300 signal-buy-strong relative overflow-hidden";
                    signalText.innerHTML = "STRONG BUY (매수) <span class='text-4xl drop-shadow-md'>🔥🐕</span>";
                    signalDesc.innerHTML = `<strong>VIX ${currentVix.toFixed(1)} 돌파!</strong> 하락과 시장 공포가 겹쳤습니다. 현금을 발사할 완벽한 기회입니다.`;
                    totalChangeEl.className = "text-4xl font-black text-red-700 drop-shadow-sm";
                } else {
                    card.className = "p-6 rounded-2xl shadow-md transition-all duration-300 signal-buy-weak relative overflow-hidden";
                    signalText.innerHTML = "BUY (분할매수) <span class='text-4xl drop-shadow-md'>🛒🐕</span>";
                    signalDesc.innerHTML = `설정한 하락폭(${limit.buy}%)에 도달했습니다. 1차 매수를 진행하세요.`;
                    totalChangeEl.className = "text-4xl font-black text-orange-600 drop-shadow-sm";
                }
            } else if (finalCalculatedChange >= limit.sell) {
                card.className = "p-6 rounded-2xl shadow-md transition-all duration-300 signal-sell relative overflow-hidden";
                signalText.innerHTML = "SELL (분할매도) <span class='text-4xl drop-shadow-md'>💰🐕</span>";
                signalDesc.innerHTML = `목표치(+${limit.sell}%)를 초과했습니다. 기계적으로 일부 익절을 진행하세요.`;
                totalChangeEl.className = "text-4xl font-black text-green-700 drop-shadow-sm";
            } else {
                card.className = "p-6 rounded-2xl shadow-md transition-all duration-300 signal-hold relative overflow-hidden";
                signalText.innerHTML = "HOLD (관망) <span class='text-4xl drop-shadow-md'>💤🐕</span>";
                signalDesc.innerHTML = "특별한 이슈가 없는 구간입니다. 여유롭게 복리가 굴러가게 두세요.";
                totalChangeEl.className = "text-4xl font-black text-slate-700 drop-shadow-sm";
            }

            // 보수적 예상 가격 밴드 계산
            const basePrice = etfBasePrice[etfName];
            const rangeEl = document.getElementById('expectedPriceRange');
            const basePriceEl = document.getElementById('basePriceText');

            if (basePrice) {
                const exactExpected = basePrice * (1 + final
